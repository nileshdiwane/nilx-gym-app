<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gym Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column, one job per screen, a single ember accent reserved for the next action. */
:root{
  color-scheme:dark;
  --bg:#101114; --surface:#191b20; --raised:#23262d; --line:#30343d;
  --text:#f3f0ea; --muted:#9da1ab; --accent:#ff7a2f; --accent-ink:#1b0d03;
  --good:#4fd1a5; --warn:#f5c451;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:400 16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:34px;text-transform:uppercase}
h2{font-size:26px;text-transform:uppercase}
h3{font-size:20px;text-transform:uppercase}
p{margin:0}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13.5px}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}
#view{flex:1;overflow-y:auto;padding:20px 16px 28px;display:flex;flex-direction:column;gap:16px}
#tabs{display:flex;border-top:1px solid var(--line);background:var(--surface)}
#tabs button{flex:1;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
#tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--accent)}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.cta{display:block;width:100%;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.04em;text-transform:uppercase;padding:15px 18px;border-radius:14px;text-align:center}
.cta:active{transform:translateY(1px)}
.cta.ghost{background:var(--raised);color:var(--text)}
.btn{background:var(--raised);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14.5px;text-decoration:none;color:var(--text);display:inline-block}
.link{color:var(--accent);font-weight:600;font-size:14.5px;text-decoration:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14.5px;font-weight:600;color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.exrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:8px 0;border-top:1px solid var(--line)}
.exrow:first-child{border-top:0}
.thumb{width:62px;height:62px;border-radius:10px;background:#fff;object-fit:cover;flex:none}
.exrow b{display:block;font-weight:600}
.dose{font-family:var(--display);font-weight:600;font-size:19px;color:var(--accent);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted)}
.chev{color:var(--muted);font-size:20px;flex:none}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--good)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.q{font-weight:600;font-size:15px}
.field input,.field textarea{background:var(--raised);border:1.5px solid var(--line);border-radius:12px;padding:12px;width:100%}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.err{color:var(--warn);font-weight:600}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .num{font-size:30px;line-height:1}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.g i{background:var(--good)}
.meal{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.meal:first-of-type{border-top:0;padding-top:0}
.meal ul{margin:0;padding-left:18px;color:var(--text)}
.meal li{margin:2px 0}
.tick{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-weight:700;color:transparent}
.tick.on{background:var(--good);border-color:var(--good);color:#06281d}
/* coach */
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface);border-bottom-left-radius:4px}
.composer{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:0;background:var(--bg);padding:10px 0 12px;margin-top:auto}
.composer textarea{flex:1;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;resize:none;min-height:48px;max-height:120px}
.round{width:48px;height:48px;border-radius:50%;background:var(--raised);display:grid;place-items:center;flex:none}
.round.go{background:var(--accent);color:var(--accent-ink)}
.round.live{background:var(--warn);color:#2a2104}
.round svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* overlays */
#gym,#sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto}
#sheet{z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
.sheet{background:var(--surface);width:100%;max-width:480px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 16px 26px;max-height:92%;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.gymin{max-width:480px;margin:0 auto;min-height:100%;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px}
.demo{position:relative;background:#fff;border-radius:var(--r);overflow:hidden;aspect-ratio:3/2}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.demo img.b{animation:flip 2.6s infinite}
.demo span{position:absolute;left:10px;bottom:8px;background:rgba(16,17,20,.82);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.05em;text-transform:uppercase}
@keyframes flip{0%,42%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair figure{margin:0;background:#fff;border-radius:12px;overflow:hidden}
.pair img{display:block;width:100%;max-width:100%}
.pair figcaption{background:var(--raised);font-size:12px;font-weight:700;text-align:center;padding:4px;text-transform:uppercase;letter-spacing:.06em}
.target{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--raised);border-radius:14px;padding:6px}
.stepper button{width:52px;height:52px;border-radius:10px;background:var(--surface);font-size:26px;font-weight:600}
.stepper div{text-align:center}
.stepper .num{font-size:30px;line-height:1}
.clock{font-family:var(--display);font-weight:700;font-size:96px;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.setdots{display:flex;gap:6px}
.setdots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.setdots i.on{background:var(--accent)}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
ul.bad{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
svg.chart{width:100%;height:auto;display:block}
.lockscreen{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:12px 0}
.pinbox{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.pindots{display:flex;gap:18px;margin:10px 0 2px}
.pindots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.pindots i.on{background:var(--accent);border-color:var(--accent)}
.pindots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}
.pinpad button{width:72px;height:72px;border-radius:50%;background:var(--raised);font-family:var(--display);font-size:30px;font-weight:600}
.pinpad button:active{background:var(--line)}
@media (prefers-reduced-motion:reduce){.demo img.b{animation:none;opacity:0}.pindots.shake{animation:none}}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav id="tabs" hidden>
    <button data-a="tab" data-v="today"><svg viewBox="0 0 24 24"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>Today</button>
    <button data-a="tab" data-v="food"><svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0zM9 4c0 1.5 1 1.5 1 3M14 4c0 1.5 1 1.5 1 3"/></svg>Food</button>
    <button data-a="tab" data-v="coach"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Coach</button>
    <button data-a="tab" data-v="progress"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M7 15l4-5 3 3 5-7"/></svg>Progress</button>
  </nav>
</div>
<div id="gym" hidden></div>
<div id="sheet" hidden></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const dstr=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>dstr(new Date());
const pdate=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])};
const dayNum=s=>Math.round(pdate(s).getTime()/864e5);
const nice=s=>pdate(s).toLocaleDateString("en-IN",{day:"numeric",month:"short"});
const fq=q=>{const w=Math.floor(q),f=q-w;return f===0.5?(w?w+"½":"½"):String(Math.round(q*10)/10)};
const kcal=m=>m.p*4+m.c*4+m.f*9;

/* ---------- state ---------- */
const KEY="gymbuddy.v1";
const blank=()=>({v:1,ts:0,profile:null,logs:[],body:[],checkin:null,rot:0,swap:{},eaten:{},chat:[],session:null,voice:false,restOverride:null});
let S=blank(), ALL={v:2,ts:0,active:"p1",people:{}}, tab="today", remote=null, synced=false, booting=true;
function adopt(o){
  if(o&&o.people)ALL=o;else if(o)ALL={v:2,ts:o.ts||0,active:"p1",people:{p1:o}};
  if(!ALL.people[ALL.active])ALL.active=Object.keys(ALL.people)[0]||"p1";
  S=Object.assign(blank(),ALL.people[ALL.active]||{});ALL.people[ALL.active]=S;
}
try{const raw=localStorage.getItem(KEY);adopt(raw?JSON.parse(raw):null)}catch(e){adopt(null)}
let saveT=null, writing=false, dirty=false;
function save(){
  S.ts=Date.now();ALL.ts=S.ts;ALL.people[ALL.active]=S;
  try{localStorage.setItem(KEY,JSON.stringify(ALL))}catch(e){}
  if(remote){dirty=true;clearTimeout(saveT);saveT=setTimeout(push,1500)}
}
async function push(){
  if(!remote||writing||!dirty)return;
  writing=true;dirty=false;
  try{await remote.set({ts:ALL.ts,json:JSON.stringify(ALL)});synced=true}catch(e){synced=false}
  writing=false; if(dirty)push();
}
let caps={sample:null,tts:null,dict:null};
async function boot(){
  if(!window.claude)await new Promise(r=>setTimeout(r,800));
  const use=n=>{try{return window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null)}catch(e){return Promise.resolve(null)}};
  use("sample").then(x=>{caps.sample=x;if(tab==="coach"&&S.profile)render()});
  use("tts").then(x=>{caps.tts=x});
  use("dictation").then(x=>{caps.dict=x;if(x)wireDict();if(tab==="coach"&&S.profile)render()});
  const load=(async()=>{
    const [db,user]=await Promise.all([use("db"),use("user")]);
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    const ref=db.doc("data/users/"+id+"/app");
    const snap=await ref.get();
    remote=ref;
    if(snap.exists){
      const d=snap.data();
      if(d&&d.json&&(d.ts||0)>(ALL.ts||0)){
        const editing=!S.profile&&document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName);
        if(!S.session&&!editing){adopt(JSON.parse(d.json));try{localStorage.setItem(KEY,d.json)}catch(e){}}
      }
      synced=true;
    }else if(S.profile){dirty=true;push()}
  })().catch(()=>{});
  await Promise.race([load,new Promise(r=>setTimeout(r,S.profile?0:3500))]);
  booting=false;render();
  load.then(()=>{if(!S.session)render()});
}

const EX={

 b:["Bench set too upright, which turns it into a shoulder press","Dropping the weights fast","Arching your lower back off the pad"]},

 b:["Knees caving inward","Heels lifting","Rounding your lower back at the bottom"]},

 s:["Hold one dumbbell upright against your chest with both hands.","Feet shoulder-width, toes slightly out.","Sit straight down between your knees until your thighs are parallel or lower.","Stand up tall, keeping your chest up throughout."],

function roundW(id,w){const e=EX[id],st=STEP[e.eq],mn=MINW[e.eq];return Math.max(mn,Math.round(w/st)*st)}
function estimate(id){
  const p=S.profile,e=EX[id]; if(!e.r)return 0;
  const lv={beg:.65,mid:1,adv:1.3}[p.level], sx=p.sex==="f"?((e.g==="Legs"||e.g==="Glutes")?.75:.6):1, bw=Math.min(p.weight,85);
  let w=bw*e.r*lv*sx;
  if(p.bench10>0){const base=bw*EX.mchest.r*lv*(p.sex==="f"?.6:1); w*=Math.min(2,Math.max(.5,p.bench10/base))}
  return roundW(id,w);
}
function lastLog(id){
  for(let i=S.logs.length-1;i>=0;i--){const x=S.logs[i].ex.find(e=>e.id===id&&e.sets.length);if(x)return x}
  return null;
}
function checkin(){return S.checkin&&S.checkin.date===today()?S.checkin:{energy:"ok",sore:[]}}
function prescribe(id,slot){
  const p=S.profile,e=EX[id],ci=checkin(),h=lastLog(id);
  let sets=3,lo=10,hi=12,rest=75;
  if(COMPOUND.includes(slot)){lo=p.level==="beg"?10:8;hi=p.level==="beg"?12:10;rest=p.level==="beg"?90:120;if(p.level==="adv")sets=4}
  else if(SMALL.includes(slot)){lo=12;hi=15;rest=60}
  else{lo=12;hi=15;rest=45}
  if(e.eq==="sec"){lo=30;hi=45;rest=45}
  if(e.eq==="bw"&&id==="pushup"){lo=8;hi=15}
  if(id==="bridge"){lo=15;hi=20}
  let w=0,note="",first=!h;
  if(e.r){
    const st=STEP[e.eq];
    if(!h){w=estimate(id);note="Starting estimate. Change it on your first set if it feels wrong and I will remember."}
    else{
      const lw=Math.max.apply(null,h.sets.map(s=>s.w)),minR=Math.min.apply(null,h.sets.map(s=>s.r));
      if(h.feel==="hard"||minR<lo){
        if(minR<lo-2){w=roundW(id,lw-st);note="A little lighter. Last time the reps fell short."}
        else{w=lw;note="Same weight. Get every set to "+lo+" reps."}
      }else if((minR>=hi||h.feel==="easy")&&ci.energy!=="low"){w=roundW(id,lw+st);note="Up "+st+" kg. You hit every rep last time."}
      else{w=lw;note="Same weight. Aim for one more rep on each set."}
    }
  }else if(h){
    const minR=Math.min.apply(null,h.sets.map(s=>s.r));
    note=minR>=hi?"You reached the top target. Slow each rep down to make it harder.":"Beat last time: "+h.sets.map(s=>s.r).join(", ")+".";
  }
  if(ci.energy==="low"){sets=Math.max(2,sets-1);note="Tired today, so one set fewer. "+note}
  if(ci.sore.includes(e.g)){sets=Math.max(2,sets-1);if(w){w=roundW(id,w*.9)}note=e.g+" still sore, so lighter and one set fewer."}
  return {id,slot,sets,lo,hi,rest,w,note,first};
}
function pick(slot,used){
  const p=S.profile,opts=SLOT[slot][p.level==="beg"?"beg":"adv"],inj=p.injuries||[];
  return opts.find(id=>!used.includes(id)&&!(EX[id].av&&inj.includes(EX[id].av)))||null;
}
function todayPlan(){
  const p=S.profile,seq=splitFor(p),key=seq[S.rot%seq.length],d=DAY[key];
  const max={45:5,60:6,75:7}[p.minutes]||6,used=[],items=[],skipped=[];
  for(const slot of d[1]){
    if(items.length>=max)break;
    const id=pick(slot,used); if(!id){skipped.push(slot);continue}
    used.push(id);items.push(prescribe(id,slot));
  }
  const ci=checkin(),walk={45:8,60:10,75:15}[p.minutes]||10;
  if(ci.energy!=="low"&&p.goal!=="muscle")items.push({id:"walk",slot:"cardio",sets:1,lo:walk,hi:walk,rest:0,w:0,note:"Burns extra calories without hurting recovery."});
  let secs=6*60;items.forEach(x=>{secs+=x.id==="walk"?x.lo*60:x.sets*((EX[x.id].eq==="sec"?x.hi:40)+x.rest)});
  return {key,name:d[0],items,mins:Math.round(secs/60/5)*5,skipped};
}

function targets(){

  const tdee=bmr*(1.375+((p.days||4)-3)*.05),adj=calAdjust();
  const k=Math.max(p.sex==="f"?1200:1500,Math.round((tdee*(p.goal==="muscle"?1.05:.8)+adj.k)/10)*10),lean=Math.min(p.weight,90);
  const pr=Math.round(lean*((p.whey||p.diet==="nonveg")?1.8:1.6)),f=Math.round(lean*.8),c=Math.max(80,Math.round((k-pr*4-f*9)/4));
  return {k,p:pr,f,c,tdee:Math.round(tdee),adj};
}
function trend(){
  const b=S.body.filter(x=>x.w).slice().sort((a,z)=>a.date<z.date?-1:1); if(b.length<2)return null;
  const last=b[b.length-1],ld=dayNum(last.date);
  let ref=null;for(const x of b){if(ld-dayNum(x.date)>=13){ref=x}}
  if(!ref)return null;
  const weeks=(ld-dayNum(ref.date))/7;return {perWeek:(last.w-ref.w)/weeks,pct:(last.w-ref.w)/weeks/ref.w*100,weeks};
}
function calAdjust(){
  const t=trend(); if(!t||t.weeks>5)return {k:0,why:""};
  if(S.profile.goal==="muscle"){
    if(t.pct<-.1)return {k:120,why:"Your weight is dropping and muscle needs fuel, so I added 120 kcal to your day."};
    if(t.pct>.5)return {k:-100,why:"You are gaining faster than muscle can be built, so I trimmed 100 kcal."};
    return {k:0,why:"Your weight is moving at a good pace for building muscle. Calories stay the same."};
  }
  if(t.pct>-.15)return {k:-120,why:"Your weight has barely moved in "+Math.round(t.weeks)+" weeks, so I trimmed 120 kcal from your day."};
  if(t.pct<-1.1)return {k:150,why:"You are losing faster than 1% of your weight a week, which risks muscle. I added 150 kcal."};
  return {k:0,why:"You are losing at a healthy pace. Calories stay the same."};
}
function foodOK(f,date){
  const p=S.profile,t=FOOD[f][6],al=p.allergies||[];
  if(t==="egg")return (p.diet==="egg"||p.diet==="nonveg")&&!al.includes("egg");
  if(t==="meat")return p.diet==="nonveg";
  if(t==="dairy"){if(p.diet==="vegan"||al.includes("dairy")||p.dairy==="never")return false;if(p.dairy==="some")return [1,3,5].includes(pdate(date).getDay());return true}
  if(t)return !al.includes(t);
  return true;
}
function macros(items){const m={p:0,c:0,f:0};items.forEach(([f,q])=>{const d=FOOD[f],k=q/d[2];m.p+=d[3]*k;m.c+=d[4]*k;m.f+=d[5]*k});return m}
function mealDay(date){
  const p=S.profile,T=targets(),dn=dayNum(date),sw=S.swap[date]||{};
  const meals=MSLOT.map(([k,label,hint],si)=>{
    const ok=MEALS[k].filter(o=>o[1].every(([f])=>foodOK(f,date))&&(!o[2]||p.whey));
    const list=ok.length?ok:[MEALS[k][0]],o=list[(dn+si*3+(sw[k]||0))%list.length];
    return {k,label,hint,name:o[0],items:o[1].map(a=>[a[0],a[1]]),n:list.length};
  });
  const by=k=>meals.find(m=>m.k===k),get=(m,f)=>{const it=m.items.find(i=>i[0]===f);return it?it[1]:0};
  const add=(m,f,q)=>{const it=m.items.find(i=>i[0]===f);if(it)it[1]+=q;else m.items.push([f,q])};
  const tot=()=>{const m=macros([].concat.apply([],meals.map(x=>x.items)));m.k=kcal(m);return m};
  const clean=()=>meals.forEach(m=>{m.items=m.items.filter(i=>i[1]>0.01)});
  const grow=(k,f,step,max)=>()=>{const m=by(k);if(!foodOK(f,date)||get(m,f)>=max)return false;add(m,f,step);return true};
  const lean={tofu:[25,200],chicken:[25,200],fish:[25,200]};
  const boost=[
    grow("post","eggw",1,4),
    ()=>{if(p.diet==="nonveg")return false;return grow("lunch","soya",10,40)()},
    ()=>{for(const m of meals)for(const it of m.items){const c=lean[it[0]];if(c&&it[1]<c[1]){it[1]+=c[0];return true}}return false},
    grow("bfast","eggw",1,3), grow("snack","sprouts",50,150), grow("dinner","dal",.5,1.5), grow("snack","chana",10,40), grow("lunch","dal",.5,1.5)
  ];
  for(let round=0;round<3;round++){
  for(let i=0,miss=0;i<60&&miss<boost.length&&tot().p<T.p-3;i++){if(boost[i%boost.length]())miss=0;else miss++}
  const main=["bfast","lunch","dinner"].map(by);
  /* trim order: food, step, minimum left in a meal */
  const trim=[["oil",1,0],["roti",1,1],["rice",50,100],["peanut",10,0],["bread",1,1],["besan",1,2],["mchilla",1,2],["idli",1,2],["oats",10,30],["curd",50,0],["apple",1,0],["banana",1,0],["khichdi",.25,.75],["milk",100,100],["paneer",20,60],["swp",50,100],["sabzi",.5,.5]];
  for(let i=0;i<60;i++){
    const diff=T.k-tot().k; if(Math.abs(diff)<=60)break;
    if(diff>0){
      const r=main.filter(m=>get(m,"roti")>0&&get(m,"roti")<4).sort((a,b)=>get(a,"roti")-get(b,"roti"))[0];
      const c=main.filter(m=>get(m,"rice")>0&&get(m,"rice")<250)[0];
      if(r)add(r,"roti",1);else if(c)add(c,"rice",50);else if(foodOK("roti",date)&&get(by("dinner"),"roti")===0)add(by("dinner"),"roti",1);else if(get(by("pre"),"banana")<2)add(by("pre"),"banana",1);else break;
    }else{
      let done=false;
      for(const [f,st,mn] of trim){
        const d=FOOD[f],one=kcal({p:d[3],c:d[4],f:d[5]})*st/d[2];
        if(one>-diff+60)continue;
        const m=meals.filter(x=>get(x,f)-st>=mn-1e-6).sort((a,b)=>get(b,f)-get(a,f))[0];
        if(m){add(m,f,-st);done=true;break}
      }
      if(!done)break;
    }
  }
  }
  clean();
  meals.forEach(m=>{m.m=macros(m.items);m.m.k=kcal(m.m)});
  return {meals,T,tot:tot()};
}

function bodyFat(x){

  const v=495/(1.0324-.19077*Math.log10(x.waist-x.neck)+.15456*Math.log10(p.height))-450;
  return v>3&&v<60?Math.round(v*10)/10:null;
}
function strengthRows(){
  const seen={};
  S.logs.forEach(l=>l.ex.forEach(e=>{if(!EX[e.id]||!EX[e.id].r||!e.sets.length)return;const best=Math.max.apply(null,e.sets.map(s=>s.w*(1+s.r/30)));const top=e.sets.reduce((a,s)=>s.w>a.w||(s.w===a.w&&s.r>a.r)?s:a);(seen[e.id]=seen[e.id]||[]).push({best,top,date:l.date})}));
  return Object.keys(seen).filter(id=>seen[id].length>=2).map(id=>{const a=seen[id];return {id,first:a[0],last:a[a.length-1],pct:Math.round((a[a.length-1].best/a[0].best-1)*100)}}).sort((a,b)=>b.pct-a.pct);

function chart(points,unit){
  if(points.length<2)return '<p class="muted small">Log this twice and your trend line appears here.</p>';
  const W=320,H=110,px=12,pt=20,pb=20,vs=points.map(p=>p.v),mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs),sp=(mx-mn)||1;
  const d0=dayNum(points[0].date),dx=(dayNum(points[points.length-1].date)-d0)||1;
  const xy=points.map(p=>[px+(dayNum(p.date)-d0)/dx*(W-2*px),pt+(mx-p.v)/sp*(H-pt-pb)]);
  const line=xy.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" "),l=xy[xy.length-1],f=xy[0];
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Trend from '+points[0].v+' to '+points[points.length-1].v+' '+unit+'">'+
   '<path d="'+line+' L'+l[0].toFixed(1)+' '+(H-pb)+' L'+f[0].toFixed(1)+' '+(H-pb)+' Z" fill="var(--accent)" opacity=".13"/>'+
   '<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
   '<circle cx="'+l[0].toFixed(1)+'" cy="'+l[1].toFixed(1)+'" r="4.5" fill="var(--accent)"/>'+

   '<text x="'+px+'" y="'+(H-5)+'" fill="var(--muted)" font-size="11">'+nice(points[0].date)+'</text>'+
   '<text x="'+(W-px)+'" y="'+(H-5)+'" fill="var(--muted)" font-size="11" text-anchor="end">'+nice(points[points.length-1].date)+'</text></svg>';
}

let asking=false,ctl=null;
async function ask(q){
  q=(q||"").trim(); if(!q||asking)return;
  if(!caps.sample){S.chat.push({r:"u",t:q},{r:"a",t:"Coach chat is not available in this view right now."});save();render();return}
  const hist=S.chat.slice(-6).filter(m=>m.t).map(m=>({role:m.r==="u"?"user":"assistant",content:m.t}));
  while(hist.length&&hist[0].role!=="user")hist.shift();
  const msgs=[];hist.forEach(m=>{if(!msgs.length||msgs[msgs.length-1].role!==m.role)msgs.push(m)});
  if(msgs.length&&msgs[msgs.length-1].role==="user")msgs.pop();
  msgs.push({role:"user",content:brief()+"\nQUESTION\n"+q});
  S.chat.push({r:"u",t:q},{r:"a",t:""});if(S.chat.length>24)S.chat=S.chat.slice(-24);
  asking=true;render();
  const i=S.chat.length-1,bubble=()=>document.querySelector('.msg[data-i="'+i+'"]');
  if(bubble())bubble().textContent="Thinking…";
  ctl=new AbortController();
  try{
    const r=await caps.sample(msgs,{cache:false,signal:ctl.signal,onText:({text})=>{const b=bubble();if(b){b.innerHTML=fmt(text);$("#view").scrollTop=$("#view").scrollHeight}}});
    S.chat[i].t=r.text||"I did not get an answer. Ask again.";
    speak(S.chat[i].t.replace(/\*\*/g,""));
  }catch(e){
    S.chat[i].t=e&&e.code==="rate_limited"?"Too many questions in a short time. Wait a minute and ask again.":e&&e.code==="not_granted"?"Coach chat was not allowed for this page. Allow it when asked, then send your question again.":(e&&e.text)||"I could not reach the coach just now. Check your connection and ask again.";
  }
  asking=false;save();if(tab==="coach")render();
}

function altFor(s,x){

function onTick(){
  const s=S.session; if(!s||$("#gym").hidden)return;

  const left=Math.max(0,Math.ceil((s.end-Date.now())/1000)),c=$("#clock");
  if(c)c.textContent=Math.floor(left/60)+":"+pad(left%60);

    else finishTimed();
  }

function afterSet(){

  save();renderGym();$("#gym").scrollTop=0;
}
function finishWorkout(){
  const s=S.session,ex=s.items.filter(x=>x.done.length).map(x=>({id:x.id,sets:x.done,feel:x.feel||"right"}));
  if(ex.length){S.logs.push({date:s.date===today()?s.date:today(),key:s.key,name:s.name,mins:Math.max(1,Math.round((Date.now()-s.t0)/6e4)),ex});S.rot++;if(S.logs.length>400)S.logs=S.logs.slice(-400)}
  S.session=null;save();tab="today";closeGym();$("#view").scrollTop=0;
  speak("Workout complete. Well done. Eat your post workout meal now.");
}

/* ---------- sheet ---------- */
function openDetail(id){
  const e=EX[id];
  $("#sheet").innerHTML='<div class="sheet" role="dialog" aria-label="'+e.n+'"><div class="row between"><h2>'+e.n+'</h2><button class="btn" data-a="closesheet">Close</button></div><div class="pair"><figure><img src="ex/'+id+'-0.jpg" alt="Start position"><figcaption>Start</figcaption></figure><figure><img src="ex/'+id+'-1.jpg" alt="End position"><figcaption>Finish</figcaption></figure></div><p><span class="muted">Works: </span>'+e.m+'</p><h3>How to do it</h3><ol class="steps">'+e.s.map(t=>'<li>'+t+'</li>').join("")+'</ol><h3>Avoid</h3><ul class="bad">'+e.b.map(t=>'<li>'+t+'</li>').join("")+'</ul><a class="link" href="https://www.youtube.com/results?search_query='+encodeURIComponent(e.n+" proper form")+'" target="_blank" rel="noopener">Find a video of this exercise ›</a></div>';
  $("#sheet").hidden=false;
}
function confirmSheet(title,text,yes,fn){
  $("#sheet").innerHTML='<div class="sheet" role="dialog"><h2>'+title+'</h2><p class="muted">'+text+'</p><button class="cta" id="yes">'+yes+'</button><button class="cta ghost" data-a="closesheet">Cancel</button></div>';
  $("#sheet").hidden=false;$("#yes").onclick=()=>{$("#sheet").hidden=true;fn()};
}

/* ---------- PIN lock ---------- */
let unlocked=new Set(), pin=null, pinT=null, hiddenAt=0;
const hasPin=o=>!!(o&&o.pinHash);
const locked=()=>hasPin(S)&&!unlocked.has(ALL.active);
const waitLeft=()=>Math.max(0,Math.ceil(((S.pinUntil||0)-Date.now())/1000));
const subtleOK=()=>{try{return !!(window.crypto&&crypto.subtle&&window.isSecureContext)}catch(e){return false}};
function rand(){try{const a=new Uint8Array(16);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return Math.random().toString(16).slice(2)+Date.now().toString(16)}}
async function hashPin(salt,code,alg){
  const t=salt+":"+code;
  if(alg==="sha256"){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  let h=2166136261;for(let r=0;r<4000;r++)for(let i=0;i<t.length;i++){h^=t.charCodeAt(i)+r;h=Math.imul(h,16777619)>>>0}return h.toString(16);
}
async function checkPin(code){
  if(S.pinAlg==="sha256"&&!subtleOK())return null;
  try{return (await hashPin(S.pinSalt,code,S.pinAlg||"sha256"))===S.pinHash}catch(e){return null}
}
function pinText(st){
  const nm=esc((S.profile||{}).name||"");
  if(st.mode==="unlock")return ["Hi "+nm,"Enter your 4-digit PIN"];
  if(st.step==="old")return ["Current PIN","Enter the PIN you use now"];
  if(st.step==="new")return ["Choose a PIN","4 digits. Needed to open "+nm+"’s plan"];
  return ["Enter it again","Type the same 4 digits to confirm"];
}
function padHTML(st){
  const [t,sub]=pinText(st),w=st.step==="old"?waitLeft():0;
  return '<div class="pinbox"><h2>'+t+'</h2><p class="muted">'+sub+'</p>'+
   '<div class="pindots'+(st.err?" shake":"")+'" role="img" aria-label="'+st.a.length+' of 4 digits entered">'+[0,1,2,3].map(i=>'<i class="'+(i<st.a.length?"on":"")+'"></i>').join("")+'</div>'+
   '<p class="err" role="alert" style="min-height:1.45em">'+(w?"Too many wrong tries. Wait "+w+" seconds.":esc(st.err||""))+'</p>'+
   '<div class="pinpad">'+[1,2,3,4,5,6,7,8,9].map(n=>'<button data-a="pinkey" data-v="'+n+'">'+n+'</button>').join("")+'<span></span><button data-a="pinkey" data-v="0">0</button><button data-a="pinkey" data-v="del" aria-label="Delete last digit">⌫</button></div></div>';
}
function lockHTML(){
  if(!pin||pin.mode!=="unlock")pin={mode:"unlock",step:"old",a:"",err:"",where:"view"};
  return '<div class="lockscreen">'+padHTML(pin)+'<div class="row" style="justify-content:center;flex-wrap:wrap;gap:10px">'+(Object.keys(ALL.people).length>1?'<button class="btn" data-a="people">Switch person</button>':'')+'<button class="btn" data-a="forgot">Forgot PIN?</button></div></div>';
}
function drawPin(){
  clearTimeout(pinT);
  if(!pin){$("#sheet").hidden=true;render();return}
  if(pin.where==="view")render();
  else{$("#sheet").innerHTML='<div class="sheet" role="dialog" aria-label="PIN">'+padHTML(pin)+'<button class="cta ghost" data-a="pincancel">Cancel</button></div>';$("#sheet").hidden=false}
  if(pin.step==="old"&&waitLeft())pinT=setTimeout(drawPin,1000);
}
async function pinPress(v){
  const st=pin; if(!st||st.busy)return;
  if(v==="del"){st.a=st.a.slice(0,-1);st.err="";drawPin();return}
  if(st.a.length>=4||(st.step==="old"&&waitLeft()))return;
  st.a+=v;st.err="";drawPin();
  if(st.a.length<4)return;
  st.busy=true;await new Promise(r=>setTimeout(r,120));await pinSubmit(st);st.busy=false;drawPin();
}
async function pinSubmit(st){
  const code=st.a;st.a="";
  if(st.step==="old"){
    const ok=await checkPin(code);
    if(ok===null){st.err="This browser cannot check the PIN. Open the app over https.";return}
    if(!ok){S.pinFails=(S.pinFails||0)+1;if(S.pinFails>=5){S.pinFails=0;S.pinUntil=Date.now()+30000}save();st.err="Wrong PIN. Try again.";try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}return}
    S.pinFails=0;S.pinUntil=0;
    if(st.mode==="unlock"){unlocked.add(ALL.active);pin=null;save();return}
    if(st.mode==="remove"){delete S.pinHash;delete S.pinSalt;delete S.pinAlg;pin=null;save();return}
    st.step="new";return;
  }
  if(st.step==="new"){st.first=code;st.step="confirm";return}
  if(code!==st.first){st.step="new";st.first="";st.err="The two PINs did not match. Choose again.";return}
  const alg=subtleOK()?"sha256":"fnv",salt=rand();
  S.pinSalt=salt;S.pinAlg=alg;S.pinHash=await hashPin(salt,code,alg);S.pinFails=0;S.pinUntil=0;
  unlocked.add(ALL.active);pin=null;save();
}
function eraseActive(){
  const ids=Object.keys(ALL.people);
  if(ids.length>1){delete ALL.people[ALL.active];ALL.active=Object.keys(ALL.people)[0];S=Object.assign(blank(),ALL.people[ALL.active])}
  else{S=blank();ALL.people[ALL.active]=S}
  pin=null;save();tab="today";render();
}
const lockIcon='<svg viewBox="0 0 24 24" width="14" height="14" aria-label="PIN protected" style="vertical-align:-2px;margin-left:6px;fill:none;stroke:currentColor;stroke-width:2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';

/* ---------- actions ---------- */
const A={
  tab(el){tab=el.dataset.v;render();$("#view").scrollTop=0},
  chip(el){const box=el.parentElement;if(box.dataset.multi)el.classList.toggle("on");else{box.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));el.classList.add("on")}},
  energy(el){const c=checkin();S.checkin={date:today(),energy:el.dataset.v,sore:c.sore};save();render()},
  sore(el){const c=checkin(),g=el.dataset.v,sore=c.sore.includes(g)?c.sore.filter(x=>x!==g):c.sore.concat(g);S.checkin={date:today(),energy:c.energy,sore};save();render()},
  detail(el){openDetail(el.dataset.v)},
  closesheet(){$("#sheet").hidden=true;if(pin&&pin.where==="sheet")pin=null},
  start(){startGym()},
  resume(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}openGym()},
  abandon(){confirmSheet("End this workout?","Sets you already did today will not be saved.","End workout",()=>{S.session=null;save();render()})},
  anyway(){S.trainAnyway=true;render()},
  ate(el){const d=today(),a=S.eaten[d]||[],k=el.dataset.v;S.eaten={};S.eaten[d]=a.includes(k)?a.filter(x=>x!==k):a.concat(k);save();render()},
  swapmeal(el){const d=today(),cur=S.swap[d]||{};cur[el.dataset.v]=(cur[el.dataset.v]||0)+1;S.swap={};S.swap[d]=cur;save();render()},
  voice(){S.voice=!S.voice;save();if(S.voice)speak("Voice is on.");else{try{caps.tts&&caps.tts.stop();window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}}if(S.session&&!$("#gym").hidden)renderGym();else render()},
  quick(el){ask(el.textContent)},
  send(){const a=$("#ask");if(dictOn&&caps.dict){caps.dict.stop().catch(()=>{})}ask(a.value)},
  mic(){const d=caps.dict;if(!d)return;if(dictOn){d.stop().catch(()=>{})}else{d.start().catch(e=>{if(e&&e.code==="not_granted"){caps.dict=null;render()}})}},
  explain(){tab="coach";render();ask("Explain my progress so far in simple words, and tell me the one thing to focus on this week.")},
  edit(){$("#tabs").hidden=true;$("#view").innerHTML=onboardHTML(S.profile);$("#view").scrollTop=0},
  reset(){confirmSheet("Erase this person?","Their details, workouts and measurements will be deleted.","Erase",eraseActive)},
  people(){$("#sheet").innerHTML='<div class="sheet" role="dialog" aria-label="Who is training?"><div class="row between"><h2>Who is training?</h2><button class="btn" data-a="closesheet">Close</button></div><div class="chips">'+Object.keys(ALL.people).map(id=>'<button class="chip'+(id===ALL.active?" on":"")+'" data-a="person" data-v="'+id+'">'+esc((ALL.people[id].profile||{}).name||"New person")+(hasPin(ALL.people[id])?lockIcon:"")+'</button>').join("")+'<button class="chip" data-a="addperson">+ Add a person</button></div><p class="note">Each person gets their own plan, meals and history.</p>'+(hasPin(S)&&!locked()?'<button class="cta ghost" data-a="locknow">Lock '+esc(S.profile.name)+'’s plan</button>':'')+'</div>';$("#sheet").hidden=false},
  locknow(){unlocked=new Set();pin=null;$("#sheet").hidden=true;render()},
  forgot(){const nm=esc((S.profile||{}).name||"this person");confirmSheet("Forgot the PIN?","A PIN cannot be recovered. You can erase "+nm+"’s plan, workouts and measurements and set them up again.","Erase and start over",eraseActive)},
  pinkey(el){pinPress(el.dataset.v)},
  pinset(){pin={mode:"set",step:"new",a:"",err:"",first:"",where:"sheet"};drawPin()},
  pinchange(){pin={mode:"change",step:"old",a:"",err:"",first:"",where:"sheet"};drawPin()},
  pinremove(){pin={mode:"remove",step:"old",a:"",err:"",first:"",where:"sheet"};drawPin()},
  pincancel(){pin=null;drawPin()},
  person(el){$("#sheet").hidden=true;if(el.dataset.v===ALL.active)return;unlocked=new Set();pin=null;ALL.active=el.dataset.v;S=Object.assign(blank(),ALL.people[ALL.active]);save();tab="today";render();$("#view").scrollTop=0},
  addperson(){$("#sheet").hidden=true;unlocked=new Set();pin=null;const id="p"+Date.now();ALL.people[id]=blank();ALL.active=id;S=ALL.people[id];save();tab="today";render();$("#view").scrollTop=0},
  cancelnew(){delete ALL.people[ALL.active];ALL.active=Object.keys(ALL.people)[0];S=Object.assign(blank(),ALL.people[ALL.active]);save();tab="progress";render()},
  /* gym */
  pause(){save();closeGym()},
  go(){const s=S.session;s.phase="set";save();renderGym();announce(s.items[0]);$("#gym").scrollTop=0},
  wup(){const x=cur();x.curW=roundW(x.id,x.curW+STEP[EX[x.id].eq]);renderGym()},
  wdn(){const x=cur();x.curW=roundW(x.id,x.curW-STEP[EX[x.id].eq]);renderGym()},
  rup(){const x=cur();x.curR+=EX[x.id].eq==="sec"?5:1;renderGym()},
  rdn(){const x=cur();x.curR=Math.max(1,x.curR-(EX[x.id].eq==="sec"?5:1));renderGym()},
  setdone(){const x=cur();x.done.push({w:x.curW||0,r:x.curR});if(x.curW&&x.done.length===1)x.w=x.curW;afterSet()},
  timer(){const s=S.session,x=cur();s.phase="work";s.end=Date.now()+x.curR*(EX[x.id].eq==="min"?60:1)*1000;save();renderGym()},
  workdone(){finishTimed(true)},
  more(){S.session.end+=30000;onTick()},
  skiprest(){S.session.phase="set";save();renderGym()},
  feel(el){cur().feel=el.dataset.v;save();renderGym()},
  next(){const s=S.session;if(s.i>=s.items.length-1){finishWorkout();return}s.i++;s.phase="set";save();renderGym();$("#gym").scrollTop=0;announce(s.items[s.i])},
  skipex(){const s=S.session;if(s.i>=s.items.length-1){finishWorkout();return}s.i++;s.phase="set";save();renderGym();$("#gym").scrollTop=0;announce(s.items[s.i])},
  swapex(){const s=S.session,x=cur(),alt=altFor(s,x);if(!alt)return;const n=prescribe(alt,x.slot);s.items[s.i]=Object.assign({},n,{done:[],feel:null,curW:n.w,curR:startReps(n,0)});save();renderGym();announce(s.items[s.i])},
  askex(){const x=cur();save();closeGym();tab="coach";render();ask("I am about to do "+EX[x.id].n+" at "+(x.curW||"body weight")+(x.curW?" kg":"")+". Give me the 3 most important form cues for my level and how the last reps should feel.")}
};
const cur=()=>S.session.items[S.session.i];
document.addEventListener("click",ev=>{
  if(ev.target.id==="sheet"){$("#sheet").hidden=true;if(pin&&pin.where==="sheet")pin=null;return}
  const el=ev.target.closest("[data-a]"); if(!el)return;
  const f=A[el.dataset.a]; if(f){if(el.tagName!=="A")ev.preventDefault();f(el)}
});
document.addEventListener("submit",ev=>{
  ev.preventDefault();
  if(ev.target.id==="ob")submitOnboard();
  if(ev.target.id==="log"){
    const w=parseFloat($("#l-w").value)||0,wa=parseFloat($("#l-waist").value)||0,ne=parseFloat($("#l-neck").value)||0;
    if(!w&&!wa)return;
    const prev=S.body.slice().sort((a,z)=>a.date<z.date?-1:1).pop()||{};
    S.body=S.body.filter(x=>x.date!==today());
    S.body.push({date:today(),w:w||prev.w||S.profile.weight,waist:wa||prev.waist||S.profile.waist,neck:ne||prev.neck||S.profile.neck||0});
    if(w)S.profile.weight=w; if(wa)S.profile.waist=wa; if(ne)S.profile.neck=ne;
    save();render();
  }
});
document.addEventListener("keydown",ev=>{
  if(pin&&!/INPUT|TEXTAREA/.test(ev.target.tagName)&&(pin.where==="view"?locked():!$("#sheet").hidden)){if(/^[0-9]$/.test(ev.key)){ev.preventDefault();pinPress(ev.key);return}if(ev.key==="Backspace"){ev.preventDefault();pinPress("del");return}}
if(ev.target.id==="ask"&&ev.key==="Enter"&&!ev.shiftKey){ev.preventDefault();A.send()}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.session&&!$("#gym").hidden)onTick()});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  if(hiddenAt&&Date.now()-hiddenAt>10*60e3&&!S.session&&hasPin(S)&&!locked()){unlocked=new Set();pin=null;$("#sheet").hidden=true;render()}
  hiddenAt=0;
});
render();boot();
</script>
